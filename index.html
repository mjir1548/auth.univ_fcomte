  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.pressed}}\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 10px 0 6px; min-height: 48px; border: 0; background: transparent; color: #f3ece0; text-align: left; cursor: pointer; font-family: 'Archivo', Arial, sans-serif\">\n<span style=\"position: relative; display: block; width: 100%; height: 2px; background: #f3ece0; opacity: 1; overflow: hidden\"><span style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: {{sc.bg}}; opacity: 0.6\"><\u002Fspan><span style=\"{{t.bar}}\"><\u002Fspan><\u002Fspan>\n<span style=\"{{t.labelStyle}}\">{{t.num}} — {{t.short}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"manifeste\" style=\"padding: clamp(110px, 12vw, 180px) clamp(16px, 4.5vw, 64px); display: flex; flex-direction: column; align-items: center; gap: 36px; text-align: center\">\n<p class=\"tk-reveal\" style=\"margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #5a5348\">— MANIFESTE —<\u002Fp>\n<h2 id=\"manifeste\" class=\"tk-words\" style=\"margin: 0; max-width: 1100px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(36px, 5vw, 76px); line-height: 1.06; font-weight: 300; letter-spacing: -0.01em\">\n<span style=\"transition-delay: 0ms\">Le<\u002Fspan> <span style=\"transition-delay: 45ms\">vêtement<\u002Fspan> <span style=\"transition-delay: 90ms\"><em>fleurit.<\u002Fem><\u002Fspan> <span style=\"transition-delay: 135ms\">La<\u002Fspan> <span style=\"transition-delay: 180ms\">marque<\u002Fspan> <span style=\"transition-delay: 225ms\">se<\u002Fspan> <span style=\"transition-delay: 270ms\">tait.<\u002Fspan> <span style=\"transition-delay: 315ms\">Une<\u002Fspan> <span style=\"transition-delay: 360ms\">fleur,<\u002Fspan> <span style=\"transition-delay: 405ms\">une<\u002Fspan> <span style=\"transition-delay: 450ms\">seule,<\u002Fspan> <span style=\"transition-delay: 495ms\">posée<\u002Fspan> <span style=\"transition-delay: 540ms\">là<\u002Fspan> <span style=\"transition-delay: 585ms\">où<\u002Fspan> <span style=\"transition-delay: 630ms\">on<\u002Fspan> <span style=\"transition-delay: 675ms\">ne<\u002Fspan> <span style=\"transition-delay: 720ms\">l'attend<\u002Fspan> <span style=\"transition-delay: 765ms\"><em>pas.<\u002Fem><\u002Fspan>\n<\u002Fh2>\n<p class=\"tk-reveal\" style=\"margin: 0; max-width: 34em; color: #5a5348; transition-delay: .3s\">Pas de logo sur la poitrine, pas d'imprimé répété. Chaque pièce porte le nom latin de sa fleur et un numéro de planche, du dessin jusqu'à l'étiquette.<\u002Fp>\n<a class=\"tk-link tk-reveal\" href=\"Atelier.dc.html\" style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #16130f; text-decoration: none; padding: 14px 0; transition-delay: .45s\">LIRE L'HISTOIRE DE L'ATELIER<\u002Fa>\n<\u002Fsection>\n\n<section id=\"lookbook\" aria-labelledby=\"titre-lookbook\" style=\"position: relative; overflow: hidden; background: #12100d; color: #f3ece0; padding: clamp(110px, 12vw, 170px) clamp(16px, 4.5vw, 64px)\">\n<p class=\"tk-par\" aria-hidden=\"true\" style=\"position: absolute; left: -2vw; bottom: -4vw; margin: 0; white-space: nowrap; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 300; font-size: 24vw; line-height: 0.8; color: #1f1c17; pointer-events: none\">armandii<\u002Fp>\n<div style=\"position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 64px 80px\">\n<div style=\"flex: 1 1 320px; max-width: 480px; display: flex; flex-direction: column; gap: 28px\">\n<p class=\"tk-reveal\" style=\"margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #d9cfbf\">LOOKBOOK — PLANCHE N° 01<\u002Fp>\n<h2 id=\"titre-lookbook\" class=\"tk-reveal\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 300; font-size: clamp(56px, 7.4vw, 116px); line-height: 0.9; letter-spacing: -0.015em; transition-delay: .1s\">Clematis armandii<\u002Fh2>\n<p class=\"tk-reveal\" style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #d9cfbf; transition-delay: .2s\">La seule veste de la collection. Des clématites écrues montent le long de la toile noire, du devant jusqu'au dos, entre quatre fermoirs à crochet.<\u002Fp>\n<a class=\"tk-btn tk-reveal\" href=\"Piece.dc.html\" style=\"align-self: flex-start; display: inline-flex; align-items: center; min-height: 52px; padding: 0 30px; border: 1px solid #f3ece0; color: #f3ece0; text-decoration: none; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; --tk-fill: #f3ece0; --tk-ink: #12100d; transition-delay: .3s\">DÉCOUVRIR LA VESTE<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex: 2 1 480px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\">\n<figure class=\"tk-par-rev\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<div class=\"tk-wipe\" style=\"position: relative; aspect-ratio: 4 / 5; background: #2f4a3a; overflow: hidden\"><img src=\"af2b0f1b-5c3a-481e-9192-7679f4707c5c\" alt=\"Veste noire brodée de clématites écrues, vue avant\" style=\"position: absolute; left: 12%; top: 11%; width: 76%; height: 78%; object-fit: contain\"><\u002Fdiv>\n<figcaption style=\"display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #d9cfbf\"><span>VUE AVANT<\u002Fspan><span>I / II<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<figure class=\"tk-offset tk-par\" style=\"margin-bottom: 0; margin-left: 0; margin-right: 0; display: flex; flex-direction: column; gap: 12px\">\n<div class=\"tk-wipe\" style=\"position: relative; aspect-ratio: 4 / 5; background: #e6dccb; overflow: hidden; transition-delay: .2s\"><img src=\"00debb15-f98b-4d41-8cde-c4b667abf901\" alt=\"Veste noire brodée de clématites écrues, vue de dos\" style=\"position: absolute; left: 12%; top: 11%; width: 76%; height: 78%; object-fit: contain\"><\u002Fdiv>\n<figcaption style=\"display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #d9cfbf\"><span>VUE DE DOS<\u002Fspan><span>II / II<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"matiere\" style=\"display: flex; flex-direction: column; gap: 48px; padding: clamp(110px, 12vw, 170px) clamp(16px, 4.5vw, 64px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 64px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<p class=\"tk-reveal\" style=\"margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #5a5348\">MATIÈRE<\u002Fp>\n<h2 id=\"matiere\" class=\"tk-reveal\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(48px, 6vw, 92px); line-height: 0.92; font-weight: 400; letter-spacing: -0.02em; transition-delay: .1s\">Au plus près <em style=\"font-weight: 300\">du fil<\u002Fem><\u002Fh2>\n<\u002Fdiv>\n<p class=\"tk-reveal\" style=\"margin: 0; max-width: 26em; color: #5a5348; transition-delay: .2s\">Broderie sur la veste, maille jacquard bouclée sur les pulls. Les fleurs se lisent de loin ; la matière, elle, se regarde de près.<\u002Fp>\n<\u002Fdiv>\n<div class=\"tk-bento\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px\">\n<figure class=\"tk-wipe tk-zoom\" style=\"grid-column: span 2; grid-row: span 2; margin: 0; position: relative; overflow: hidden; background: #1f3a4d; min-height: 280px\">\n<img src=\"7cae49b3-c76d-4f16-be2e-ebcd8ade5533\" alt=\"Gros plan sur un hibiscus en maille jacquard bleue\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover\">\n<figcaption style=\"position: absolute; left: 16px; bottom: 16px; padding: 8px 12px; background: #f1ebe1; font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">N° 03 — CŒUR D'HIBISCUS<\u002Ffigcaption>\n<\u002Ffigure>\n<figure class=\"tk-wipe tk-zoom\" style=\"margin: 0; position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #8f3a1c; transition-delay: .1s\">\n<img src=\"8ecf3f00-48e1-4e4d-8073-1ccc19587589\" alt=\"Gros plan sur des pétales de lys orange en maille bouclée\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover\">\n<figcaption style=\"position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; background: #f1ebe1; font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">N° 02 — PÉTALE<\u002Ffigcaption>\n<\u002Ffigure>\n<figure class=\"tk-wipe tk-zoom\" style=\"margin: 0; position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #2f4a3a; transition-delay: .2s\">\n<img src=\"75929cb5-ae66-4458-9a72-40dee85110a0\" alt=\"Gros plan sur une clématite brodée en fil écru sur toile noire\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover\">\n<figcaption style=\"position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; background: #f1ebe1; font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">N° 01 — BRODERIE<\u002Ffigcaption>\n<\u002Ffigure>\n<figure class=\"tk-wipe tk-zoom\" style=\"margin: 0; position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #64304a; transition-delay: .3s\">\n<img src=\"46bdccb2-934a-4440-b0c7-eb11e9754093\" alt=\"Gros plan sur des iris prune et bordeaux en maille\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover\">\n<figcaption style=\"position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; background: #f1ebe1; font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">N° 04 — MAILLE<\u002Ffigcaption>\n<\u002Ffigure>\n<figure class=\"tk-wipe tk-zoom\" style=\"margin: 0; position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #87394a; transition-delay: .4s\">\n<img src=\"0f10a5c0-d1f3-4bf3-b235-0fc3246d1293\" alt=\"Gros plan sur un lys rose tacheté en maille bouclée écrue\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover\">\n<figcaption style=\"position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; background: #f1ebe1; font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">N° 05 — LYS ROSE<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"liste\" aria-labelledby=\"titre-liste\" style=\"position: relative; overflow: hidden; background: #8f3a1c; color: #f3ece0; padding: clamp(110px, 12vw, 170px) clamp(16px, 4.5vw, 64px)\">\n<p class=\"tk-par-rev\" aria-hidden=\"true\" style=\"position: absolute; right: -3vw; top: 2vw; margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 300; font-size: 30vw; line-height: 0.8; color: #9a4425; pointer-events: none\">N°<\u002Fp>\n<div style=\"position: relative; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 56px 80px\">\n<div style=\"flex: 1 1 380px; max-width: 640px; display: flex; flex-direction: column; gap: 24px\">\n<p class=\"tk-reveal\" style=\"margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #f3ece0\">LISTE D'ATTENTE<\u002Fp>\n<h2 id=\"titre-liste\" class=\"tk-reveal\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(48px, 6.2vw, 96px); line-height: 0.95; font-weight: 400; letter-spacing: -0.02em; transition-delay: .1s\">Le premier tirage ouvre le <em style=\"font-weight: 300\">[date du drop].<\u002Fem><\u002Fh2>\n<p class=\"tk-reveal\" style=\"margin: 0; max-width: 28em; font-size: 17px; line-height: 1.6; color: #f0dccf; transition-delay: .2s\">[N] exemplaires par planche, pas un de plus. Inscrivez-vous pour être prévenu 48 heures avant l'ouverture.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"tk-reveal\" style=\"flex: 1 1 400px; max-width: 540px; display: flex; flex-direction: column; gap: 28px; transition-delay: .25s\">\n<sc-if value=\"{{notDone}}\" hint-placeholder-val=\"{{ true }}\">\n<form sc-camel-on-submit=\"{{submit}}\" style=\"display: flex; flex-direction: column; gap: 28px\">\n<fieldset style=\"margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px\">\n<legend style=\"padding: 0 0 12px; font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">LES PLANCHES QUI VOUS INTÉRESSENT<\u002Flegend>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{c.toggle}}\" aria-pressed=\"{{c.pressed}}\" style=\"{{c.style}}\"><span style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">{{c.num}}<\u002Fspan><span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.2\">{{c.latin}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"email\" style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em\">ADRESSE E-MAIL<\u002Flabel>\n<input id=\"email\" name=\"email\" type=\"email\" required=\"\" autocomplete=\"email\" placeholder=\"vous@exemple.fr\" value=\"{{email}}\" sc-camel-on-change=\"{{setEmail}}\" style=\"box-sizing: border-box; width: 100%; height: 56px; padding: 0; border: 0; border-bottom: 1px solid #f3ece0; border-radius: 0; background: transparent; color: #f3ece0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px\">\n<\u002Fdiv>\n<button class=\"tk-btn\" type=\"submit\" style=\"min-height: 56px; padding: 0 32px; border: 1px solid #f3ece0; border-radius: 0; background: #f3ece0; color: #8f3a1c; font-family: 'Archivo', Arial, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; cursor: pointer; --tk-fill: #16130f; --tk-ink: #f3ece0\">ÊTRE PRÉVENU 48 HEURES AVANT<\u002Fbutton>\n<p style=\"margin: 0; font-size: 12px; line-height: 1.5; color: #f0dccf\">Un seul e-mail, au moment de l'ouverture. Votre adresse ne sert à rien d'autre.<\u002Fp>\n<\u002Fform>\n<\u002Fsc-if>\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" class=\"tk-fade\" style=\"display: flex; flex-direction: column; gap: 16px; padding: 32px 0; border-top: 1px solid #f3ece0; border-bottom: 1px solid #f3ece0\">\n<p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 300; font-size: 64px; line-height: 1\">Merci.<\u002Fp>\n<p style=\"margin: 0\">Vous recevrez un e-mail 48 heures avant l'ouverture du premier tirage.<\u002Fp>\n<p style=\"margin: 0; font-size: 13px; color: #f0dccf\">{{pickedText}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background: #16130f; color: #f3ece0; padding: 96px clamp(16px, 4.5vw, 64px) 0; overflow: hidden\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 48px 32px\">\n<div class=\"tk-reveal\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; max-width: 22em; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; line-height: 1.3\">Vêtements brodés et tricotés, en petites séries numérotées.<\u002Fp>\n<a class=\"tk-link\" href=\"#titre-hero\" style=\"align-self: flex-start; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #f3ece0; text-decoration: none; padding: 14px 0\">↑ HAUT DE PAGE<\u002Fa>\n<\u002Fdiv>\n<nav class=\"tk-reveal\" aria-label=\"La maison\" style=\"display: flex; flex-direction: column; gap: 2px; transition-delay: .08s\">\n<p style=\"margin: 0 0 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #a99f8f\">LA MAISON<\u002Fp>\n<a class=\"tk-link\" href=\"Collection.dc.html\" style=\"align te-space: nowrap; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(84px, 19.5vw, 290px); line-height: 0.74; letter-spacing: 0.22em; margin-right: -0.22em; color: #f3ece0\"><span style=\"transition-delay: 0ms\">T<\u002Fspan><span style=\"transition-delay: 80ms\">R<\u002Fspan><span style=\"transition-delay: 160ms\">A<\u002Fspan><span style=\"transition-delay: 240ms\">K<\u002Fspan><span style=\"transition-delay: 320ms\">E<\u002Fspan><\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding: 24px 0; border-top: 1px solid #3b372f; font-size: 12px; color: #a99f8f\">\n<span>© 2026 Trake<\u002Fspan>\n<span><a href=\"#\" style=\"color: #a99f8f\">Mentions légales<\u002Fa> · <a href=\"#\" style=\"color: #a99f8f\">CGV<\u002Fa> · <a href=\"#\" style=\"color: #a99f8f\">Confidentialité<\u002Fa><\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroPiece&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bleu&quot;,&quot;rose&quot;,&quot;orange&quot;,&quot;violet&quot;,&quot;veste&quot;],&quot;default&quot;:&quot;bleu&quot;,&quot;section&quot;:&quot;Accueil&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Vitrine des planches&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6700}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { email: '', done: false, picks: {}, active: 0, paused: false, started: false };\n  }\n  componentDidMount() {\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce || this.props.autoplay === false) { this.setState({ paused: true }); }\n    if ('IntersectionObserver' in window && !reduce) {\n      document.documentElement.classList.add('tk-js');\n      this.io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); this.io.unobserve(e.target); } });\n      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });\n      this.scan();\n    }\n    this.kick = setTimeout(() => this.setState({ started: true }), 60);\n    this.startTimer();\n  }\n  componentDidUpdate() { this.scan(); }\n  componentWillUnmount() { if (this.io) this.io.disconnect(); clearInterval(this.timer); clearTimeout(this.kick); }\n  scan() {\n    if (!this.io) return;\n    document.querySelectorAll('.tk-reveal:not(.is-in), .tk-wipe:not(.is-in), .tk-words:not(.is-in)').forEach((el) => {\n      if (!el.__tkSeen) { el.__tkSeen = true; this.io.observe(el); }\n    });\n  }\n  startTimer() {\n    clearInterval(this.timer);\n    this.timer = setInterval(() => {\n      if (!this.state.paused) this.setState((s) => ({ active: (s.active + 1) % 5 }));\n    }, 6500);\n  }\n  go(i) { this.setState({ active: (i + 5) % 5 }); this.startTimer(); }\n  renderVals() {\n    const A = {\n      veste: '/_blob/fb53a8d45e257473deba27214f2ebb8a',\n      orange: '/_blob/9c56ac0f09ef0d31321d5cd2bd57da20',\n      bleu: '/_blob/78eda227c0d648a8d2c3ce4453421a09',\n      violet: '/_blob/6e043d35b95733eedfa998d51e150256',\n      rose: '/_blob/68ddfe78cc780ba571fb1420b07b3589'\n    };\n    const heroes = {\n      bleu: { img: A.bleu, alt: 'Pull écru en maille jacquard, grands hibiscus bleus', num: 'N° 03', latin: 'Hibiscus syriacus', author: 'L.', family: 'Malvaceae', piece: 'Pull, maille jacquard', coloris: 'Écru et bleus', dots: [{ c: '#ddd8cc' }, { c: '#2f4a5c' }, { c: '#7d93a0' }], wm: '#16130f' },\n      orange: { img: A.orange, alt: 'Pull noir en maille jacquard, lys tigrés orange', num: 'N° 02', latin: 'Lilium lancifolium', author: 'Thunb.', family: 'Liliaceae', piece: 'Pull, maille jacquard', coloris: 'Noir, orange et ocre', dots: [{ c: '#141211' }, { c: '#b0301a' }, { c: '#d0652f' }, { c: '#e8a25e' }], wm: '#8f3a1c' },\n      violet: { img: A.violet, alt: 'Pull noir en maille jacquard, iris prune et bordeaux', num: 'N° 04', latin: 'Iris germanica', author: 'L.', family: 'Iridaceae', piece: 'Pull, maille jacquard', coloris: 'Noir, prune et bordeaux', dots: [{ c: '#121014' }, { c: '#7a2230' }, { c: '#8c4479' }, { c: '#b27aa6' }], wm: '#64304a' },\n      veste: { img: A.veste, alt: 'Veste noire brodée de clématites écrues', num: 'N° 01', latin: 'Clematis armandii', author: 'Franch.', family: 'Ranunculaceae', piece: 'Veste brodée', coloris: 'Noir, écru et vert gris', dots: [{ c: '#141413' }, { c: '#d6ccbb' }, { c: '#66705d' }], wm: '#2f4a3a' },\n      rose: { img: A.rose, alt: 'Pull écru en maille jacquard, lys roses tachetés sur de longues tiges vertes', num: 'N° 05', latin: 'Lilium speciosum', author: 'Thunb.', family: 'Liliaceae', piece: 'Pull, maille jacquard', coloris: 'Écru, rose et vert', dots: [{ c: '#ece5d8' }, { c: '#d4878a' }, { c: '#6b1a2a' }, { c: '#3e7b3e' }], wm: '#87394a' }\n    };\n    const hero = heroes[this.props.heroPiece] || heroes.bleu;\n    const data = [\n      { n: '01', num: 'N° 01', short: 'Clématite', type: 'VESTE BRODÉE', latin: 'Clematis armandii', author: 'Franch.', common: \"Clématite d'Armand\", family: 'Ranunculaceae', flo: 'Début du printemps', coloris: 'Noir, écru, vert gris', bg: '#2f4a3a', img: A.veste, alt: 'Veste noire brodée de clématites écrues', href: 'Piece.dc.html', desc: 'Toile noire et quatre fermoirs à crochet. Des clématites écrues montent du bas jusqu’aux épaules.', dots: [{ c: '#141413' }, { c: '#d6ccbb' }, { c: '#66705d' }] },\n      { n: '02', num: 'N° 02', short: 'Lys tigré', type: 'PULL JACQUARD', latin: 'Lilium lancifolium', author: 'Thunb.', common: 'Lys tigré', family: 'Liliaceae', flo: 'Été', coloris: 'Noir, orange, ocre', bg: '#8f3a1c', img: A.orange, alt: 'Pull noir en maille, lys tigrés orange', href: 'Collection.dc.html', desc: 'Maille noire bouclée. Trois lys orange traversent le buste, un bouton fleurit sur la manche.', dots: [{ c: '#141211' }, { c: '#b0301a' }, { c: '#d0652f' }, { c: '#e8a25e' }] },\n      { n: '03', num: 'N° 03', short: 'Hibiscus', type: 'PULL JACQUARD', latin: 'Hibiscus syriacus', author: 'L.', common: 'Hibiscus de Syrie', family: 'Malvaceae', flo: 'Été à automne', coloris: 'Écru, bleus', bg: '#1f3a4d', img: A.bleu, alt: 'Pull écru en maille, hibiscus bleus', href: 'Collection.dc.html', desc: 'Maille écrue. De grands hibiscus bleus en dégradé, posés sur le devant et repris sur les manches.', dots: [{ c: '#ddd8cc' }, { c: '#2f4a5c' }, { c: '#7d93a0' }] },\n      { n: '04', num: 'N° 04', short: 'Iris', type: 'PULL JACQUARD', latin: 'Iris germanica', author: 'L.', common: 'Iris des jardins', family: 'Iridaceae', flo: 'Fin du printemps', coloris: 'Noir, prune, bordeaux', bg: '#64304a', img: A.violet, alt: 'Pull noir en maille, iris prune et bordeaux', href: 'Collection.dc.html', desc: 'Maille noire. Des iris prune et bordeaux en grand format, du col jusqu’aux poignets.', dots: [{ c: '#121014' }, { c: '#7a2230' }, { c: '#8c4479' }, { c: '#b27aa6' }] },\n      { n: '05', num: 'N° 05', short: 'Lys du Japon', type: 'PULL JACQUARD', latin: 'Lilium speciosum', author: 'Thunb.', common: 'Lys du Japon', family: 'Liliaceae', flo: \"Fin de l'été\", coloris: 'Écru, rose, vert', bg: '#87394a', img: A.rose, alt: 'Pull écru en maille, lys roses tachetés sur de longues tiges vertes', href: 'Collection.dc.html', desc: 'Maille écrue bouclée. Deux lys roses tachetés sur de longues tiges vertes, et un bouton qui grimpe le long de la manche.', dots: [{ c: '#ece5d8' }, { c: '#d4878a' }, { c: '#6b1a2a' }, { c: '#3e7b3e' }] }\n    ];\n    const { active, paused, started } = this.state;\n    const sc = data[active];\n    const slides = data.map((d, i) => {\n      const on = i === active;\n      return {\n        ...d,\n        hidden: on ? 'false' : 'true',\n        textStyle: 'grid-area: 1 / 1; display: flex; flex-direction: column; gap: 18px; ' + (on\n          ? 'opacity: 1; transform: none; visibility: visible; transition: opacity .9s ease .35s, transform 1.1s cubic-bezier(.2,.7,.2,1) .3s, visibility 0s;'\n          : 'opacity: 0; transform: translateY(28px); visibility: hidden; transition: opacity .45s ease, transform .6s ease, visibility 0s linear .6s;'),\n        imgStyle: 'grid-area: 1 / 1; position: relative; z-index: 2; display: block; width: min(100%, 470px); height: auto; max-height: 540px; object-fit: contain; ' + (on\n          ? 'opacity: 1; transform: none; transition: opacity 1s ease .2s, transform 1.3s cubic-bezier(.2,.7,.2,1) .15s;'\n          : 'opacity: 0; transform: translateY(60px) scale(.9) rotate(-4deg); transition: opacity .6s ease, transform .9s ease;')\n      };\n    });\n    const tabs = data.map((d, i) => {\n      const on = i === active;\n      let bar = 'position: absolute; left: 0; top: 0; height: 100%; background: #f3ece0; ';\n      if (!on) bar += 'width: 0%; transition: none;';\n      else if (paused || !started) bar += 'width: ' + (paused ? '100%' : '0%') + '; transition: none;';\n      else bar += 'width: 100%; transition: width 6.5s linear;';\n      return {\n        num: d.num, short: d.short,\n        pressed: on ? 'true' : 'false',\n        bar,\n        labelStyle: 'font-size: 11px; font-weight: 500; letter-spacing: 0.16em; ' + (on ? 'color: #f3ece0;' : 'color: #d9cfbf;'),\n        pick: () => this.go(i)\n      };\n    });\n    const names = [];\n    for (let k = 0; k < 2; k++) data.forEach((d) => names.push({ latin: d.latin, num: d.num, common: d.common, color: d.bg }));\n    const words = ['PREMIER TIRAGE LE [DATE DU DROP]', 'CINQ PLANCHES NUMÉROTÉES', 'BRODERIE ET MAILLE JACQUARD', \"LISTE D'ATTENTE OUVERTE\"];\n    const picks = this.state.picks;\n    const chipBase = \"display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 66px; padding: 10px 14px; border-radius: 0; text-align: left; font-family: 'Archivo', Arial, sans-serif; cursor: pointer; transition: background-color .3s ease, color .3s ease; \";\n    const chips = data.map((p) => ({\n      num: p.num, latin: p.latin,\n      pressed: picks[p.num] ? 'true' : 'false',\n      style: chipBase + (picks[p.num] ? 'background: #f3ece0; color: #8f3a1c; border: 1px solid #f3ece0;' : 'background: transparent; color: #f3ece0; border: 1px solid #c69c88;'),\n      toggle: () => this.setState({ picks: { ...picks, [p.num]: !picks[p.num] } })\n    }));\n    const chosen = data.filter((p) => picks[p.num]).map((p) => p.latin);\n    return {\n      hero, sc, slides, tabs, names, chips,\n      ticker: words.concat(words, words, words).map((text) => ({ text })),\n      playing: !paused, paused,\n      pauseLabel: paused ? 'Reprendre le défilement des planches' : 'Mettre en pause le défilement des planches',\n      togglePause: () => { this.setState({ paused: !paused }); this.startTimer(); },\n      prev: () => this.go(active - 1),\n      next: () => this.go(active + 1),\n      count: this.state.done ? 1 : 0,\n      email: this.state.email,\n      done: this.state.done,\n      notDone: !this.state.done,\n      pickedText: chosen.length ? 'Planches suivies : ' + chosen.join(', ') + '.' : 'Vous serez prévenu pour toutes les planches.',\n      setEmail: (e) => this.setState({ email: e.target.value }),\n      submit: (e) => { e.preventDefault(); this.setState({ done: true }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
